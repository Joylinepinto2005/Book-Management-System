
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Online Book Management System</h1>
        <p class="subtitle">Manage Your Books Easily</p>

        <!-- Message display -->
        <div id="message"></div>

        <!-- Add Book Form -->
        <div class="form-container">

            <h2 id="formTitle">Add New Book</h2>

            <form id="bookForm">

                <input type="hidden" id="bookId">

                <label>Book Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter book title"
                    required
                >

                <label>Author Name</label>
                <input
                    type="text"
                    id="author"
                    placeholder="Enter author name"
                    required
                >

                <label>Book Price (₹)</label>
                <input
                    type="number"
                    id="price"
                    placeholder="Enter price"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Book
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    hidden
                >
                    Cancel
                </button>

            </form>
        </div>

        <!-- Search Book -->
        <div class="search-container">

            <h2>Search Book By ID</h2>

            <input
                type="number"
                id="searchId"
                placeholder="Enter Book ID"
                min="1"
            >

            <button type="button" id="searchBtn">
                Search Book
            </button>

            <button type="button" id="showAllBtn">
                Show All Books
            </button>

        </div>

        <!-- Display Books -->
        <div class="books-container">

            <h2>Available Books</h2>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="bookList">
                        <tr>
                            <td colspan="5">Loading books...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
